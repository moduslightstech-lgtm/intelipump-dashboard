# Isolated LAB stack for InteliPump-US-Lab pricing tests.
# Project name is fixed so `docker compose` never collides with production.
name: intelipump-lab

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: intelipump-lab-mqtt
    restart: unless-stopped
    ports:
      # Non-production broker port for LAB Pi only. Firewall to Pi IPs.
      - "${LAB_MQTT_HOST_BIND:-0.0.0.0}:${LAB_MQTT_HOST_PORT:-1884}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - lab_net

  postgres:
    image: postgres:16
    container_name: intelipump-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Not published on the droplet by default (use lab override for local only).
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab_net

  consumer:
    image: ${DOCKERHUB_NAMESPACE:-kacytunde}/intelipump-consumer:${IMAGE_TAG:-latest}
    build:
      context: ../consumer
    container_name: intelipump-lab-consumer
    restart: unless-stopped
    env_file:
      - .env.lab
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TOPIC: ${MQTT_TOPIC:-intelipump/lab/#}
      MQTT_QOS: ${MQTT_QOS:-1}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INTELIPUMP_SALE_OUTBOX_PATH: /var/lib/intelipump/sale_delivery_outbox.jsonl
      INTELIPUMP_DEPLOYMENT: lab
    volumes:
      - lab_consumer_sale_outbox:/var/lib/intelipump
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    networks:
      - lab_net

  api:
    image: ${DOCKERHUB_NAMESPACE:-kacytunde}/intelipump-api:${IMAGE_TAG:-latest}
    build:
      context: ../backend
    container_name: intelipump-lab-api
    restart: unless-stopped
    env_file:
      - .env.lab
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Chicago}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://lab.intelipump.local:8088,http://127.0.0.1:8088}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_PUBLISHER_CLIENT_ID: ${MQTT_PUBLISHER_CLIENT_ID:-intelipump-lab-api-commands}
      # Force LAB downlink envelopes — never PRODUCTION on this stack.
      MQTT_COMMAND_ENVIRONMENT: LAB
      MQTT_COMMAND_TTL_SECONDS: ${MQTT_COMMAND_TTL_SECONDS:-120}
      INTELIPUMP_DEPLOYMENT: lab
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lab_net

  dashboard:
    image: ${DOCKERHUB_NAMESPACE:-kacytunde}/intelipump-dashboard:${IMAGE_TAG:-latest}
    build:
      context: ../ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_API_BASE_URL: ""
        VITE_USE_MOCK_DATA: "false"
    container_name: intelipump-lab-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lab_net

  nginx:
    image: nginx:1.27-alpine
    container_name: intelipump-lab-nginx
    restart: unless-stopped
    ports:
      # Local / SSH-tunnel only — does not take production :80/:443.
      - "127.0.0.1:${LAB_HTTP_HOST_PORT:-8088}:80"
    volumes:
      - ./nginx/lab.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_started
    networks:
      - lab_net

networks:
  lab_net:
    name: intelipump_lab_net
    driver: bridge

volumes:
  lab_consumer_sale_outbox:
    name: intelipump_lab_consumer_sale_outbox
