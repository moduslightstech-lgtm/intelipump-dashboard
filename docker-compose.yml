# InteliPump cloud stack — extends the production baseline (mqtt, postgres, consumer)
# with FastAPI + Nginx. Dashboard image can be added when the React app is ready.
#
# Secrets: copy .env.example → .env (never commit .env).
# Apply DB migrations before starting the improved consumer against production:
#   ./scripts/migrate.sh

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: intelipump-mqtt
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  postgres:
    image: postgres:16
    container_name: intelipump-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Do not publish 5432 publicly in production. Use docker-compose.override.yml locally.
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  consumer:
    build: ./consumer
    container_name: intelipump-consumer
    restart: always
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TOPIC: ${MQTT_TOPIC:-intelipump/#}
      MQTT_QOS: ${MQTT_QOS:-1}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started

  api:
    build: ./backend
    container_name: intelipump-api
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Africa/Lagos}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  dashboard:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        # Live DigitalOcean cloud API (devices/sales/SSE)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://157.230.215.93:8000/api}
        # Local FastAPI auth/admin/twin via Nginx same-origin
        VITE_APP_API_BASE_URL: ""
        VITE_USE_MOCK_DATA: "false"
    container_name: intelipump-dashboard
    restart: always
    depends_on:
      - api
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    container_name: intelipump-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - dashboard
