# InteliPump cloud stack.
#
# App images are published to Docker Hub as kacytunde/intelipump-*.
#   Local:  docker compose up --build -d
#   Droplet: docker compose pull && docker compose up -d
#            Never: docker compose down -v  (wipes Postgres)
#
# API listens on the docker network only. Do not publish :8000 on the droplet;
# the browser reaches FastAPI through nginx :80 at /api. Local laptop binding
# of 127.0.0.1:8000 belongs in docker-compose.override.yml only.

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: intelipump-mqtt
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  postgres:
    image: postgres:16
    container_name: intelipump-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Do not publish 5432 publicly. Use docker-compose.override.yml locally.
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  consumer:
    image: ${DOCKERHUB_NAMESPACE:-kacytunde}/intelipump-consumer:${IMAGE_TAG:-latest}
    build:
      context: ./consumer
    container_name: intelipump-consumer
    restart: always
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TOPIC: ${MQTT_TOPIC:-intelipump/#}
      MQTT_QOS: ${MQTT_QOS:-1}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started

  api:
    image: ${DOCKERHUB_NAMESPACE:-kacytunde}/intelipump-api:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    container_name: intelipump-api
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Africa/Lagos}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    image: ${DOCKERHUB_NAMESPACE:-kacytunde}/intelipump-dashboard:${IMAGE_TAG:-latest}
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        # Baked at image build. Must stay same-origin — never a droplet IP.
        VITE_API_BASE_URL: /api
        VITE_APP_API_BASE_URL: ""
        VITE_USE_MOCK_DATA: "false"
    container_name: intelipump-dashboard
    restart: always
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: intelipump-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_started
