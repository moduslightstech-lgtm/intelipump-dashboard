spring:
  application:
    name: fuelops-api
  datasource:
    url: jdbc:postgresql://localhost:5432/fuelops
    username: fuelops
    password: fuelops_secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:fuelops-super-secret-jwt-key-at-least-32-chars-long-here}
  expiration-ms: 86400000  # 24 hours

fuelops:
  seed:
    auto-run: ${SEED_AUTO_RUN:false}
  reconciliation:
    thresholds:
      warn-percent: 5.0
      critical-percent: 10.0
  alerts:
    data-gap-threshold-minutes: 60

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:fuelops-api-sub}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    com.fuelops: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
