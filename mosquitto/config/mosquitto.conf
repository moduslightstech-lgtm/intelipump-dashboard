# Local / new-stack Mosquitto defaults.
# Production DigitalOcean already has its own hardened config under the server's
# ./mosquitto/config volume — do not overwrite that blindly.
#
# Before production: set allow_anonymous false, add password_file + ACLs.
# See docs/security-hardening.md.

listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
