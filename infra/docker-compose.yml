version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fuelops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fuelops}
      POSTGRES_USER: ${POSTGRES_USER:-fuelops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuelops_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fuelops} -d ${POSTGRES_DB:-fuelops}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: fuelops-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fuelops}
      POSTGRES_USER: ${POSTGRES_USER:-fuelops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuelops_secret}
      MQTT_HOST: ${MQTT_HOST:-157.230.215.93}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC: ${MQTT_TOPIC:-intelipump/#}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fuelops}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fuelops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fuelops_secret}
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-fuelops-super-secret-jwt-key-at-least-32-chars}
      SEED_AUTO_RUN: "false"
      STATION_OFFLINE_THRESHOLD_SECONDS: ${STATION_OFFLINE_THRESHOLD_SECONDS:-300}
      PUMP_OFFLINE_THRESHOLD_SECONDS: ${PUMP_OFFLINE_THRESHOLD_SECONDS:-300}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: fuelops-ui
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
